<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Middagspinner 🍽️</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg:#f4f6fa;
  --card:#fff;
  --text:#000;
  --blue:#007bff;
  --green:#28a745;
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header {
  max-width:1200px;
  margin:auto;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  border:none;
  border-radius:8px;
  padding:8px 14px;
  cursor:pointer;
}

.spin-btn {
  background:var(--blue);
  color:#fff;
  font-size:26px;
  padding:16px 60px;
}

.add-btn {
  background:var(--green);
  color:#fff;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.full { grid-column:1/-1;text-align:center }

.card {
  background:var(--card);
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.card img {
  width:100%;
  border-radius:10px;
}

input,select {
  padding:6px;
  width:100%;
  margin-bottom:6px;
}

ul { padding-left:20px }
li { margin-bottom:6px }

.remove { color:red;cursor:pointer;margin-left:10px }

@media(max-width:800px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>Middag‑randomizer 🍽️</h1>
  <button class="add-btn" onclick="addDish()">➕ Ny rett</button>
</header>

<div class="container">

  <div class="full">
    <div id="spinner" style="font-size:38px;margin:15px">🎲</div>
    <button class="spin-btn" onclick="spin()">SPIN</button>
  </div>

  <div class="card" id="dishCard" style="display:none">
    <h2 id="dishName"></h2>
    <img id="dishImg">

    <label>Antall personer</label>
    <input type="number" id="people" value="2" min="1" onchange="render()">

    <h3>Ingredienser</h3>
    <ul id="ingredients"></ul>

    <input id="inName" placeholder="Ingrediens">
    <input id="inAmount" type="number" placeholder="Mengde per person">
    <select id="inUnit">
      <option value="g">gram</option>
      <option value="stk">stk</option>
    </select>
    <input id="inPrice" type="number" placeholder="Pris per enhet">
    <button onclick="addIngredient()">Legg til ingrediens</button>

    <button onclick="save()" style="margin-top:10px;background:#ffc107">💾 Lagre</button>
  </div>

  <div class="card" id="shopCard" style="display:none">
    <h2>🛒 Handleliste</h2>
    <ul id="shopping"></ul>
    <h3 id="total"></h3>
  </div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || {
  Taco:{
    img:"https://images.unsplash.com/photo-1617196035153-d96464ecf1c2",
    ing:[
      {n:"Kjøttdeig",a:150,u:"g",p:0.12},
      {n:"Lefser",a:2,u:"stk",p:5},
      {n:"Ost",a:50,u:"g",p:0.15}
    ]
  },
  Pizza:{
    img:"https://images.unsplash.com/photo-1548365328-8b849e6d7b8b",
    ing:[
      {n:"Pizzabunn",a:1,u:"stk",p:20},
      {n:"Ost",a:100,u:"g",p:0.15}
    ]
  }
};

let current=null;

function spin(){
  const keys=Object.keys(data);
  let i=0;
  const int=setInterval(()=>{
    spinner.textContent=keys[i++%keys.length];
  },120);
  setTimeout(()=>{
    clearInterval(int);
    current=keys[Math.floor(Math.random()*keys.length)];
    show();
  },2000);
}

function show(){
  dishCard.style.display=shopCard.style.display="block";
  dishName.textContent=current;
  dishImg.src=data[current].img;
  render();
}

function render(){
  ingredients.innerHTML=shopping.innerHTML="";
  let ppl=people.value;
  let sum=0;

  data[current].ing.forEach((i,idx)=>{
    let qty=i.a*ppl;
    sum+=qty*i.p;

    ingredients.innerHTML+=
      `<li>${i.n}: ${qty} ${i.u}
       <span class="remove" onclick="del(${idx})">✕</span></li>`;

    shopping.innerHTML+=
      `<li>${i.n}: ${qty} ${i.u}</li>`;
  });

  total.textContent=`💰 Totalpris ca: ${sum.toFixed(0)} kr`;
}

function addIngredient(){
  data[current].ing.push({
    n:inName.value,
    a:Number(inAmount.value),
    u:inUnit.value,
    p:Number(inPrice.value)
  });
  inName.value=inAmount.value=inPrice.value="";
  render();
}

function del(i){
  data[current].ing.splice(i,1);
  render();
}

function save(){
  localStorage.setItem("data",JSON.stringify(data));
  alert("Lagret ✅");
}

function addDish(){
  let n=prompt("Navn på retten");
  let img=prompt("Bilde‑URL");
  if(!n||!img) return;
  data[n]={img,ing:[]};
  save();
}
</script>

</body>
</html>
