<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidert mattips | Ukeplanlegger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; 
            --primary-hover: #059669;
            --ai-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --ai-gradient-hover: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            width: 100%;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        aside {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto; /* HELE menyen kan nå bles i */
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f1f5f9;
            padding: 16px;
            border-radius: var(--radius-md);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: var(--transition);
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-ai {
            background: var(--ai-gradient);
            color: white;
        }

        .btn-ai:hover:not(:disabled) {
            background: var(--ai-gradient-hover);
        }

        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dish-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: var(--radius-md);
            background: #f8fafc;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .dish-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dish-name {
            font-weight: 600;
            font-size: 16px;
        }

        .dish-price-small {
            font-size: 12px;
            color: var(--text-muted);
        }

        .star {
            color: #cbd5e1;
            cursor: pointer;
            font-size: 18px;
            margin-right: 12px;
        }

        .star.active { color: #fbbf24; }

        .remove-btn {
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        .remove-btn:hover { color: #ef4444; }

        /* Main Content */
        main {
            padding: 60px 80px;
            width: 100%;
        }

        header {
            margin-bottom: 48px;
            display: flex;
            justify-content: space-between;
        }

        h1 { font-size: 40px; font-weight: 800; }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .day-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .day-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .day-dish {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .dish-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
        }

        .dish-price {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { display: inline-block; animation: spin 1s linear infinite; }

        @media (max-width: 1100px) {
            .app-container { grid-template-columns: 1fr; }
            aside { height: auto; position: static; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Eidert mattips
            </div>

            <div>
                <h3 class="section-title">Legg til ny rett</h3>
                <div class="input-group">
                    <input type="text" id="dishInput" placeholder="Navn på rett">
                    <button id="aiBtn" class="btn btn-ai" onclick="generateWithAI()">✨ Skap med AI</button>
                    <input type="number" id="priceInput" placeholder="Est. pris (kr)">
                    <input type="text" id="ingredientsInput" placeholder="Ingredienser (kommaseparert)">
                    <button class="btn btn-primary" onclick="addDish()">Lagre i menyen</button>
                </div>
            </div>

            <div style="display: flex; flex-direction: column;">
                <h3 class="section-title">Din Meny (<span id="countTotal">0</span>)</h3>
                <div id="dishList" class="dish-list"></div>
            </div>
        </aside>

        <main>
            <header>
                <div>
                    <h1>Ukeplanlegger</h1>
                    <p style="color: var(--text-muted);">Automatisk ukeplan for Eidert</p>
                </div>
                <button class="btn btn-primary" onclick="generateWeek()">Generer ny plan</button>
            </header>
            <div id="weekGrid" class="week-grid"></div>
        </main>
    </div>

    <script>
        const days = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
        let dishes = JSON.parse(localStorage.getItem('eidert_dishes')) || [
            { name: 'Taco', fav: true, price: 250, ingredients: ['Kjøttdeig', 'Taco-sett'] },
            { name: 'Laks', fav: false, price: 180, ingredients: ['Laks', 'Poteter'] }
        ];
        let currentWeek = JSON.parse(localStorage.getItem('eidert_week')) || Array(7).fill(null);

        async function generateWithAI() {
            const nameInput = document.getElementById('dishInput');
            const priceInput = document.getElementById('priceInput');
            const ingInput = document.getElementById('ingredientsInput');
            const aiBtn = document.getElementById('aiBtn');

            const query = nameInput.value.trim() || "Finn på en spennende middagsrett.";
            aiBtn.innerHTML = '<span class="spinner">⏳</span> Tenker...';
            aiBtn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) throw new Error("Backend feil");

                const data = await response.json();
                let content = data.choices[0].message.content.trim();
                const dishObj = JSON.parse(content);
                
                nameInput.value = dishObj.name;
                priceInput.value = dishObj.price;
                ingInput.value = dishObj.ingredients.join(', ');
            } catch (error) {
                alert("AI Feil: Sjekk at Ollama kjører og at Vercel har riktig URL.");
            } finally {
                aiBtn.innerHTML = '✨ Skap med AI';
                aiBtn.disabled = false;
            }
        }

        function save() {
            localStorage.setItem('eidert_dishes', JSON.stringify(dishes));
            localStorage.setItem('eidert_week', JSON.stringify(currentWeek));
            render();
        }

        function addDish() {
            const n = document.getElementById('dishInput');
            const p = document.getElementById('priceInput');
            const i = document.getElementById('ingredientsInput');
            if (n.value) {
                dishes.unshift({ name: n.value, price: parseInt(p.value)||0, ingredients: i.value.split(',').map(x=>x.trim()) });
                n.value=''; p.value=''; i.value='';
                save();
            }
        }

        function removeDish(index) {
            dishes.splice(index, 1);
            save();
        }

        function generateWeek() {
            let pool = [...dishes];
            let result = [];
            for (let i = 0; i < 7; i++) {
                let idx = Math.floor(Math.random() * pool.length);
                result.push(pool[idx] || dishes[0]);
            }
            currentWeek = result;
            save();
        }

        function render() {
            document.getElementById('countTotal').innerText = dishes.length;
            document.getElementById('dishList').innerHTML = dishes.map((d, i) => `
                <div class="dish-item">
                    <div class="dish-info">
                        <span class="dish-name">${d.name}</span>
                        <span class="dish-price-small">${d.price} kr</span>
                    </div>
                    <span class="remove-btn" onclick="removeDish(${i})">×</span>
                </div>
            `).join('');

            document.getElementById('weekGrid').innerHTML = days.map((day, i) => {
                const d = currentWeek[i];
                return `
                    <div class="day-card">
                        <span class="day-name">${day}</span>
                        <div class="day-dish">${d ? d.name : '---'}</div>
                        <div class="dish-meta">
                            <span class="dish-price">🏷️ ${d ? d.price : 0} kr</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>
