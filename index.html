<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Middag‑randomizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg:#f5f7fb;
  --panel:#ffffff;
  --border:#e5e7eb;
  --primary:#2563eb;
  --primary-dark:#1e40af;
  --text:#111827;
  --muted:#6b7280;
  --radius:12px;
}

* { box-sizing:border-box }

body {
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background:var(--bg);
  color:var(--text);
}

.app {
  display:grid;
  grid-template-columns:300px 1fr;
  min-height:100vh;
}

/* ===== SIDEBAR ===== */
aside {
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px;
}

aside h2 {
  font-size:18px;
  margin-bottom:16px;
}

.menu-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:8px;
}

.menu-item:hover {
  background:#f3f4f6;
}

.menu-name {
  flex:1;
  cursor:pointer;
}

.star {
  cursor:pointer;
  color:#d1d5db;
}
.star.fav {
  color:#facc15;
}

/* ===== MAIN ===== */
main {
  padding:32px;
}

h1 {
  font-size:32px;
  margin:0 0 20px;
}

button {
  appearance:none;
  border:none;
  border-radius:10px;
  padding:10px 18px;
  font-size:15px;
  cursor:pointer;
}

.primary {
  background:var(--primary);
  color:white;
}
.primary:hover {
  background:var(--primary-dark);
}

.card {
  background:var(--panel);
  border-radius:var(--radius);
  padding:24px;
  border:1px solid var(--border);
  box-shadow:0 10px 20px rgba(0,0,0,0.04);
  margin-top:24px;
}

.card h2 {
  margin-top:0;
  font-size:22px;
}

/* ===== FORM ===== */
input, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:14px;
  margin-bottom:10px;
}

ul {
  padding-left:18px;
}

li {
  margin-bottom:6px;
}

.remove {
  color:#dc2626;
  cursor:pointer;
  margin-left:6px;
}

/* ===== WEEK ===== */
.week {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.day {
  background:#f9fafb;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
}

/* ===== MOBILE ===== */
@media (max-width:900px) {
  .app {
    grid-template-columns:1fr;
  }
  aside {
    border-right:none;
    border-bottom:1px solid var(--border);
  }
}
</style>
</head>

<body>
<div class="app">

<!-- ===== SIDEBAR ===== -->
<aside>
  <h2>🍽️ Retter</h2>
  <div id="menu"></div>
</aside>

<!-- ===== MAIN ===== -->
<main>
  <h1>Middag‑randomizer</h1>

  <div id="spinner" style="font-size:36px;margin-bottom:12px">🎲</div>
  <button class="primary" onclick="spin()">SPIN</button>

  <!-- ===== REDIGERING ===== -->
  <div class="card" id="editor" style="display:none">
    <h2 id="dishName"></h2>

    <label>Antall personer</label>
    <input type="number" id="people" value="2" min="1" onchange="renderIngredients()">

    <h3>Ingredienser</h3>
    <ul id="ingredients"></ul>

    <input id="iName" placeholder="Ingrediens">
    <input id="iAmount" type="number" placeholder="Mengde per person">
    <select id="iUnit">
      <option value="g">gram</option>
      <option value="stk">stk</option>
    </select>

    <button class="primary" onclick="addIngredient()">Legg til ingrediens</button>
  </div>

  <!-- ===== UKEPLAN ===== -->
  <div class="card">
    <h2>📅 Ukeplan</h2>
    <div class="week" id="week"></div>
  </div>

  <!-- ===== HANDLELISTE ===== -->
  <div class="card">
    <h2>🛒 Handleliste</h2>
    <ul id="shopping"></ul>
  </div>

</main>
</div>

<script>
/* DATA */
const days=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const defaultData={
  Taco:{on:true,fav:true,ing:[
    {n:"Kjøttdeig",a:150,u:"g"},
    {n:"Lefser",a:2,u:"stk"},
    {n:"Ost",a:50,u:"g"}]},
  Pizza:{on:true,fav:false,ing:[
    {n:"Pizzabunn",a:1,u:"stk"},
    {n:"Ost",a:100,u:"g"}]},
  Burrito:{on:true,fav:false,ing:[
    {n:"Tortilla",a:2,u:"stk"},
    {n:"Kylling",a:150,u:"g"}]}
};

let data=JSON.parse(localStorage.getItem("data"))||defaultData;
let week=JSON.parse(localStorage.getItem("week"))||{};
let current=null;

/* STORAGE */
function save(){
  localStorage.setItem("data",JSON.stringify(data));
  localStorage.setItem("week",JSON.stringify(week));
}

/* MENU */
function buildMenu(){
  menu.innerHTML="";
  Object.keys(data)
    .sort((a,b)=>data[b].fav-data[a].fav)
    .forEach(d=>{
      menu.innerHTML+=`
      <div class="menu-item">
        <input type="checkbox" ${data[d].on?"checked":""}
          onchange="data['${d}'].on=this.checked;save()">
        <span class="star ${data[d].fav?'fav':''}"
          onclick="data['${d}'].fav=!data['${d}'].fav;save();buildMenu()">★</span>
        <span class="menu-name" onclick="openDish('${d}')">${d}</span>
      </div>`;
    });
}
buildMenu();

/* SPIN */
function spin(){
  const list=Object.keys(data).filter(d=>data[d].on);
  if(!list.length) return alert("Velg minst én rett");
  let i=0;
  const int=setInterval(()=>{
    spinner.textContent=list[i++%list.length];
  },120);
  setTimeout(()=>{
    clearInterval(int);
    openDish(spinner.textContent);
  },2000);
}

/* EDIT */
function openDish(name){
  current=name;
  editor.style.display="block";
  dishName.textContent=name;
  renderIngredients();
}
function renderIngredients(){
  ingredients.innerHTML="";
  data[current].ing.forEach((i,idx)=>{
    ingredients.innerHTML+=`
      <li>${i.n}: ${i.a*people.value} ${i.u}
      <span class="remove" onclick="removeIngredient(${idx})">✕</span></li>`;
  });
  save();
}
function addIngredient(){
  if(!iName.value||!iAmount.value) return;
  data[current].ing.push({n:iName.value,a:+iAmount.value,u:iUnit.value});
  iName.value=iAmount.value="";
  renderIngredients();
}
function removeIngredient(i){
  data[current].ing.splice(i,1);
  renderIngredients();
}

/* WEEK */
function buildWeek(){
  week.innerHTML="";
  days.forEach(d=>{
    const w=week[d]||{};
    week.innerHTML+=`
    <div class="day">
      <strong>${d}</strong>
      <select onchange="setDay('${d}',this.value)">
        <option value="">–</option>
        ${Object.keys(data).map(r=>`
          <option ${w.dish===r?"selected":""}>${r}</option>`).join("")}
      </select>
      <input type="number" min="1" value="${w.p||2}"
        onchange="setPeople('${d}',this.value)">
    </div>`;
  });
  updateShopping();
}
function setDay(d,val){
  week[d]={dish:val,p:week[d]?.p||2};
  save();updateShopping();
}
function setPeople(d,val){
  if(week[d]) week[d].p=+val;
  save();updateShopping();
}

/* SHOPPING */
function updateShopping(){
  shopping.innerHTML="";
  let map={};
  Object.values(week).forEach(w=>{
    if(!w.dish) return;
    data[w.dish].ing.forEach(i=>{
      const k=i.n+i.u;
      map[k]=map[k]||{n:i.n,u:i.u,a:0};
      map[k].a+=i.a*w.p;
    });
  });
  Object.values(map).forEach(i=>{
    shopping.innerHTML+=`<li>${i.n}: ${i.a} ${i.u}</li>`;
  });
}
buildWeek();
</script>

</body>
</html>
``
