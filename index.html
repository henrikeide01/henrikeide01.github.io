<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Middagspinner 🍽️</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f6fa}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#fff;padding:15px;overflow:auto}
main{padding:20px}
h1,h2{margin-top:0}
button{border:none;border-radius:6px;padding:10px 14px;cursor:pointer}
.spin{background:#007bff;color:#fff;font-size:22px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.15);margin-top:20px}
img{width:100%;border-radius:8px}
ul{padding-left:18px}
li{margin-bottom:6px}
.remove{color:red;cursor:pointer;margin-left:8px}
input,select{width:100%;padding:6px;margin-bottom:6px}
.menu-item{cursor:pointer}
.menu-item:hover{text-decoration:underline}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{order:2}
}
</style>
</head>

<body>
<div class="layout">

<aside>
<h2>🍽️ Retter</h2>
<div id="menu"></div>
</aside>

<main>
<h1>Middag‑randomizer</h1>
<div id="spinner" style="font-size:36px">🎲</div>
<button class="spin" onclick="spin()">SPIN</button>

<div class="card" id="editor" style="display:none">
<h2 id="dishName"></h2>
<img id="dishImg">

<label>Antall personer</label>
<input type="number" id="people" value="2" min="1" onchange="render()">

<ul id="ingredients"></ul>

<input id="nName" placeholder="Ingrediens">
<input id="nAmount" type="number" placeholder="Mengde per person">
<select id="nUnit"><option>g</option><option>stk</option></select>
<input id="nPrice" type="number" placeholder="Pris per enhet">
<button onclick="addIngredient()">Legg til ingrediens</button>
</div>
</main>

</div>

<script>
const defaultData={
"Taco":{on:true,img:"https://images.unsplash.com/photo-1617196035153-d96464ecf1c2",ing:[
 {n:"Kjøttdeig",a:150,u:"g",p:.12},{n:"Lefser",a:2,u:"stk",p:5}]},
"Burrito":{on:true,img:"https://images.unsplash.com/photo-1604908554166-37a68bc2d927",ing:[
 {n:"Tortilla",a:2,u:"stk",p:6},{n:"Kylling",a:150,u:"g",p:.14}]},
"Pizza":{on:true,img:"https://images.unsplash.com/photo-1548365328-8b849e6d7b8b",ing:[
 {n:"Pizzabunn",a:1,u:"stk",p:20},{n:"Ost",a:100,u:"g",p:.15}]},
"Spaghetti Bolognese":{on:true,img:"https://images.unsplash.com/photo-1603133872878-684f7d7e8f8b",ing:[
 {n:"Kjøttdeig",a:150,u:"g",p:.12},{n:"Pasta",a:100,u:"g",p:.05}]},
"Lasagne":{on:true,img:"https://images.unsplash.com/photo-1617191518000-6db6f1e0ad43",ing:[
 {n:"Lasagneplater",a:3,u:"stk",p:4}]}
};

let data=JSON.parse(localStorage.getItem("data"))||defaultData;
let current=null;

function save(){localStorage.setItem("data",JSON.stringify(data))}

function buildMenu(){
menu.innerHTML="";
for(const d in data){
menu.innerHTML+=`
<div>
<input type="checkbox" ${data[d].on?"checked":""}
 onchange="data['${d}'].on=this.checked;save()">
<span class="menu-item" onclick="openDish('${d}')">${d}</span>
</div>`;
}}
buildMenu();

function spin(){
const list=Object.keys(data).filter(d=>data[d].on);
if(!list.length)return alert("Velg minst én rett");
let i=0;
const int=setInterval(()=>spinner.textContent=list[i++%list.length],120);
setTimeout(()=>{
clearInterval(int);
current=spinner.textContent;
openDish(current);
},2000);
}

function openDish(name){
current=name;
editor.style.display="block";
dishName.textContent=name;
dishImg.src=data[name].img;
render();
}

function render(){
ingredients.innerHTML="";
const p=people.value;
data[current].ing.forEach((i,idx)=>{
ingredients.innerHTML+=`
<li>${i.n}: ${i.a*p} ${i.u}
<span class="remove" onclick="del(${idx})">✕</span></li>`;
});
save();
}

function del(i){data[current].ing.splice(i,1);render()}

function addIngredient(){
data[current].ing.push({
n:nName.value,a:+nAmount.value,
u:nUnit.value,p:+nPrice.value});
nName.value=nAmount.value=nPrice.value="";
render();
}
</script>
</body>
</html>
