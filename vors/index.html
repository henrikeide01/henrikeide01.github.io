<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestPlan | Den ultimate vors-appen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff007a;
            --secondary: #7000ff;
            --accent: #00f2ff;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background: radial-gradient(circle at 0% 0%, #1a0b2e 0%, #050505 50%),
                        radial-gradient(circle at 100% 100%, #2e0b1a 0%, #050505 50%);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .logo { font-size: 32px; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: var(--transition); text-decoration: none; font-weight: 600; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }
        .main-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 40px; text-align: center; backdrop-filter: blur(20px); margin-bottom: 20px; }
        input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; outline: none; }
        .btn-play { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .section { display: none; }
        .section.active { display: block; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    </style>
</head>
<body>
    <div id="mainAuthView" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
        <div class="main-card" style="max-width: 450px; width: 100%;">
            <div class="logo" style="font-size: 48px; margin-bottom: 10px;">FESTPLAN</div>
            <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                <button id="mainLoginTab" class="nav-btn active" style="flex: 1;" onclick="window.setFestAuthMode('login')">Logg inn</button>
                <button id="mainRegTab" class="nav-btn" style="flex: 1;" onclick="window.setFestAuthMode('reg')">Ny bruker</button>
            </div>
            <h2 id="mainAuthTitle" style="margin-bottom: 10px;">Velkommen!</h2>
            <input type="text" id="mainUserNameInput" placeholder="Brukernavn">
            <input type="password" id="mainUserPassInput" placeholder="Passord">
            <button id="mainAuthBtn" class="btn-play" onclick="window.handleFestAuth()">Start Festplanlegging</button>
        </div>
    </div>

    <div id="appContent" style="display: none;">
        <div class="container">
            <nav>
                <div class="logo">FESTPLAN</div>
                <div class="nav-links">
                    <button class="nav-btn active" onclick="window.showSection('home')">🏠 Hjem</button>
                    <button class="nav-btn" onclick="window.showSection('leker')">🎮 Leker</button>
                    <button class="nav-btn" onclick="window.showSection('planlegger')">📅 Planlegger</button>
                    <button class="nav-btn" onclick="window.logout()" style="color: #ff4444;">Logg ut</button>
                </div>
            </nav>
            <section id="home" class="section active">
                <div class="main-card">
                    <h1>Velkommen til festen! 🍻</h1>
                    <p>Velg en fane over for å starte.</p>
                </div>
            </section>
            <section id="leker" class="section">
                <h2>🎮 Spill & Leker</h2>
                <div id="gameGrid" class="game-grid" style="margin-top: 20px;"></div>
            </section>
            <section id="planlegger" class="section">
                <h2>📅 Planlegger</h2>
                <div class="main-card" style="text-align: left; margin-top: 20px;">
                    <h3>Dine Gjenger</h3>
                    <div style="display: flex; gap: 10px; margin: 15px 0;">
                        <input type="text" id="roomCodeInput" placeholder="Vennekode..." style="margin-bottom: 0;">
                        <button class="nav-btn" onclick="window.addRoomCode()">Legg til</button>
                    </div>
                    <div id="roleRoomsList" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                </div>
                <div id="vorsView" style="margin-top: 20px;">
                    <div id="activeVorsList" class="game-grid"></div>
                </div>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnWI9w2TXkSUtq0kDQKNHJpspw6JKqEuA",
            authDomain: "eidert.firebaseapp.com",
            projectId: "eidert",
            storageBucket: "eidert.firebasestorage.app",
            messagingSenderId: "404554280464",
            appId: "1:404554280464:web:b454e6b567e1897eab6495",
            measurementId: "G-WS907SPPDR",
            databaseURL: "https://eidert-default-rtdb.europe-west1.firebasedatabase.app/" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem('fest_user');
        let currentRoom = localStorage.getItem('fest_room');
        let savedRooms = JSON.parse(localStorage.getItem('fest_saved_rooms') || "[]");
        let festAuthMode = 'login';
        let state = { users: {}, vorser: [] };

        window.setFestAuthMode = (mode) => {
            festAuthMode = mode;
            document.getElementById('mainLoginTab').className = mode === 'login' ? 'nav-btn active' : 'nav-btn';
            document.getElementById('mainRegTab').className = mode === 'reg' ? 'nav-btn active' : 'nav-btn';
            document.getElementById('mainAuthTitle').innerText = mode === 'login' ? 'Velkommen tilbake!' : 'Lag ny bruker!';
            document.getElementById('mainAuthBtn').innerText = mode === 'login' ? 'Start Festplanlegging' : 'Opprett bruker';
        };

        window.handleFestAuth = async () => {
            const user = document.getElementById('mainUserNameInput').value.trim();
            const pass = document.getElementById('mainUserPassInput').value.trim();
            if(!user || !pass) return alert("Fyll ut alt!");
            const userRef = ref(db, 'fest_accounts/' + user);
            const snap = await get(userRef);
            if (festAuthMode === 'reg') {
                if (snap.exists()) return alert("Navnet er tatt!");
                await set(userRef, { password: pass, rooms: [], friendCode: Math.random().toString(36).substring(2,8).toUpperCase(), friends: [], units: 0 });
                alert("Bruker opprettet!"); window.setFestAuthMode('login');
            } else {
                const data = snap.val();
                if (data && data.password === pass) {
                    currentUser = user; localStorage.setItem('fest_user', user);
                    savedRooms = data.rooms || []; localStorage.setItem('fest_saved_rooms', JSON.stringify(savedRooms));
                    window.checkLoginState();
                } else alert("Feil brukernavn/passord!");
            }
        };

        window.checkLoginState = () => {
            if (currentUser) {
                document.getElementById('mainAuthView').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                if (currentRoom) window.connectToRoom(currentRoom);
                window.renderPlanner();
            } else {
                document.getElementById('mainAuthView').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
            }
        };

        window.connectToRoom = (roomCode) => {
            onValue(ref(db, 'fest_rooms/' + roomCode), (snap) => {
                state = snap.val() || { users: {}, vorser: [] };
                window.renderPlanner();
            });
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        window.showSection = (id) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-links .nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'leker') window.renderGames();
        };

        window.renderGames = () => {
            const games = [
                { id: 'aldri', title: 'Jeg har aldri', icon: '🤫' },
                { id: 'peke', title: 'Pekeleken', icon: '👉' },
                { id: 'chug', title: 'Chug-konkurranse', icon: '🍺' }
            ];
            document.getElementById('gameGrid').innerHTML = games.map(g => `<div class="main-card"><span>${g.icon}</span><h3>${g.title}</h3></div>`).join('');
        };

        window.renderPlanner = () => {
            document.getElementById('roleRoomsList').innerHTML = savedRooms.map(r => `<button class="nav-btn ${currentRoom === r ? 'active' : ''}" onclick="window.loginToRoom('${r}')">${r}</button>`).join('');
            if (currentRoom) {
                const vorser = state.vorser || [];
                document.getElementById('activeVorsList').innerHTML = vorser.map(v => `<div class="main-card"><h3>${v.host}'s Vors</h3></div>`).join('') || "Ingen vors her enda.";
            }
        };

        window.loginToRoom = (r) => { currentRoom = r; localStorage.setItem('fest_room', r); window.connectToRoom(r); };
        window.addRoomCode = async () => {
            const r = document.getElementById('roomCodeInput').value.toUpperCase();
            if (r && !savedRooms.includes(r)) {
                savedRooms.push(r); localStorage.setItem('fest_saved_rooms', JSON.stringify(savedRooms));
                await update(ref(db, 'fest_accounts/' + currentUser), { rooms: savedRooms });
            }
            window.renderPlanner();
        };

        window.checkLoginState();
    </script>
</body>
</html>
