name: Sjekk databasen (midlertidig)
on:
  push:
    branches: [sjekk-firebase]
jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase
        env:
          U: https://mexhgazwendxklbmxesx.supabase.co
          K: sb_publishable_Kww-QK7HgEWaoGPY8NP2hg_W4M4DwQE
        run: |
          H="ffffffffffffffffffffffffffff0000"
          kall() { curl -s -o /tmp/svar -w '%{http_code}' -X POST "$U/rest/v1/rpc/$1" -H "apikey: $K" -H 'Content-Type: application/json' -d "$2"; echo " $(head -c 300 /tmp/svar)"; }
          echo "1 hent ukjent: $(kall hjem_hent '{"p_hus":"00000000000000000000000000000000"}')"
          echo "2 lagre: $(kall hjem_lagre "{\"p_hus\":\"$H\",\"p_endring\":{\"sjekk\":{\"d\":\"test\",\"t\":{\".sv\":\"timestamp\"}}}}")"
          echo "3 hent: $(kall hjem_hent "{\"p_hus\":\"$H\"}")"
          echo "4 rydd: $(kall hjem_lagre "{\"p_hus\":\"$H\",\"p_endring\":{\"sjekk\":null}}")"
          echo "5 hent etter: $(kall hjem_hent "{\"p_hus\":\"$H\"}")"
          echo "6 tabell direkte: $(curl -s -o /tmp/svar -w '%{http_code}' "$U/rest/v1/hjem_husstand?select=hus" -H "apikey: $K") $(head -c 200 /tmp/svar)"
          echo "7 hjelper: $(kall hjem_sett '{"d":{},"sti":["a"],"v":1}')"
          echo "8 CORS: $(curl -s -o /dev/null -D - -X OPTIONS "$U/rest/v1/rpc/hjem_hent" -H 'Origin: https://eidert.no' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: apikey,content-type' | grep -i 'access-control-allow-origin' | tr -d '\r')"
# kjørt på nytt 10:43
