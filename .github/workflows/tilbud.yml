name: Hent matvaretilbud

on:
  schedule:
    - cron: '17 4 * * *'   # hver morgen ca. kl. 05/06 norsk tid
    - cron: '43 15 * * 6'  # lørdag ettermiddag, når neste ukes aviser ofte kommer
  workflow_dispatch:
  push:
    paths:
      - 'tilbud/scripts/**'
      - 'tilbud/innstillinger.json'
      - '.github/workflows/tilbud.yml'

permissions:
  contents: write

concurrency:
  group: tilbud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hent tilbud fra eTilbudsavis
        run: node tilbud/scripts/hent-tilbud.mjs
      - name: Hent hyllepriser fra Kassalapp
        # Trenger hemmeligheten KASSALAPP_API_KEY. Uten den hoppes steget over.
        env:
          KASSALAPP_API_KEY: ${{ secrets.KASSALAPP_API_KEY }}
        run: node tilbud/scripts/hent-priser.mjs
        continue-on-error: true
      - name: Lagre endringer
        run: |
          git config user.name "tilbud-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tilbud/data
          if git diff --cached --quiet; then
            echo "Ingen nye tilbud å lagre."
            exit 0
          fi
          git commit -m "Oppdater matvaretilbud"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
